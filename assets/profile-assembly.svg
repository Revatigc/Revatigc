<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Revati G Chavadal — profile assembly</title>
<desc id="desc">A clean futuristic profile assembly showing identity, skills, GitHub, activity, and a polished three-dimensional developer profile card.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#0d1728"/><stop offset="1" stop-color="#050816"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2940"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#93c5fd" stroke-opacity=".04"/></pattern>
</defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/>
<rect width="1200" height="500" rx="28" fill="url(#grid)"/>
<ellipse cx="600" cy="420" rx="430" ry="48" fill="#38bdf8" opacity=".08" filter="url(#glow)"/>

<text x="600" y="58" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">PROFILE ASSEMBLY</text>
<text x="600" y="84" fill="#64748b" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">TURNING SKILLS, CODE &amp; ACTIVITY INTO A DEVELOPER IDENTITY</text>

<!-- connecting track -->
<line x1="105" y1="215" x2="1095" y2="215" stroke="#26364d" stroke-width="3"/>
<line x1="105" y1="215" x2="1095" y2="215" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="990" stroke-dashoffset="990"><animate attributeName="stroke-dashoffset" values="990;0;0;990" dur="9s" repeatCount="indefinite"/></line>

<!-- stage cards -->
<g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
<g><rect x="40" y="130" width="150" height="170" rx="20" fill="url(#card)" stroke="#29415e"/><text x="115" y="158" fill="#60a5fa" font-size="12" font-weight="700">01</text><text x="115" y="190" fill="#f8fafc" font-size="16" font-weight="700">IDENTITY</text><circle cx="115" cy="232" r="27" fill="#0b1425" stroke="#60a5fa" stroke-width="2"/><circle cx="115" cy="223" r="9" fill="none" stroke="#93c5fd" stroke-width="3"/><path d="M96 253 Q115 235 134 253" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/><text x="115" y="281" fill="#64748b" font-size="11">Revati G Chavadal</text></g>
<g><rect x="205" y="130" width="150" height="170" rx="20" fill="url(#card)" stroke="#29415e"/><text x="280" y="158" fill="#60a5fa" font-size="12" font-weight="700">02</text><text x="280" y="190" fill="#f8fafc" font-size="16" font-weight="700">SKILLS</text><g fill="none" stroke="url(#blue)" stroke-width="3"><rect x="247" y="215" width="66" height="14" rx="7"/><rect x="247" y="237" width="52" height="14" rx="7"/><rect x="247" y="259" width="72" height="14" rx="7"/></g><text x="280" y="288" fill="#64748b" font-size="10">Python · APIs · Data</text></g>
<g><rect x="370" y="130" width="150" height="170" rx="20" fill="url(#card)" stroke="#29415e"/><text x="445" y="158" fill="#60a5fa" font-size="12" font-weight="700">03</text><text x="445" y="190" fill="#f8fafc" font-size="16" font-weight="700">GITHUB</text><circle cx="445" cy="238" r="30" fill="#0b1425" stroke="#60a5fa" stroke-width="2"/><path d="M430 240 l10 -13 8 8 12 -14" fill="none" stroke="#67e8f9" stroke-width="3"/><text x="445" y="288" fill="#64748b" font-size="10">Projects · Code</text></g>
<g><rect x="535" y="130" width="150" height="170" rx="20" fill="url(#card)" stroke="#29415e"/><text x="610" y="158" fill="#60a5fa" font-size="12" font-weight="700">04</text><text x="610" y="190" fill="#f8fafc" font-size="16" font-weight="700">ACTIVITY</text><g fill="url(#blue)"><rect x="573" y="247" width="12" height="22" rx="3"/><rect x="593" y="233" width="12" height="36" rx="3"/><rect x="613" y="218" width="12" height="51" rx="3"/><rect x="633" y="226" width="12" height="43" rx="3"/></g><text x="610" y="288" fill="#64748b" font-size="10">Learning · Shipping</text></g>
</g>

<!-- refined 3D profile model -->
<g filter="url(#shadow)">
<!-- depth layers -->
<path d="M765 168 L1070 168 Q1090 168 1090 188 L1090 324 Q1090 344 1070 344 L765 344 Q745 344 745 324 L745 188 Q745 168 765 168Z" fill="#07101e" stroke="#1e40af" stroke-width="3" transform="translate(18 20)" opacity=".55"/>
<path d="M765 168 L1070 168 Q1090 168 1090 188 L1090 324 Q1090 344 1070 344 L765 344 Q745 344 745 324 L745 188 Q745 168 765 168Z" fill="#0b1424" stroke="#2563eb" stroke-width="3" transform="translate(9 10)" opacity=".8"/>
<!-- main card -->
<rect x="745" y="168" width="345" height="176" rx="22" fill="url(#card)" stroke="url(#blue)" stroke-width="2"/>
<rect x="745" y="168" width="345" height="38" rx="22" fill="#17243a"/>
<circle cx="769" cy="187" r="4" fill="#60a5fa"/><circle cx="784" cy="187" r="4" fill="#22d3ee"/><circle cx="799" cy="187" r="4" fill="#818cf8"/>
<!-- profile avatar -->
<circle cx="805" cy="259" r="39" fill="#0a1425" stroke="#60a5fa" stroke-width="2"/>
<circle cx="805" cy="250" r="13" fill="none" stroke="#dbeafe" stroke-width="3"/>
<path d="M781 282 Q805 258 829 282" fill="none" stroke="#dbeafe" stroke-width="3" stroke-linecap="round"/>
<!-- profile text -->
<text x="865" y="242" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">REVATI G CHAVADAL</text>
<text x="865" y="264" fill="#67e8f9" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5">AI / ML · PYTHON · BACKEND</text>
<rect x="865" y="281" width="145" height="7" rx="3.5" fill="#24354d"/><rect x="865" y="281" width="112" height="7" rx="3.5" fill="url(#blue)"/>
<rect x="865" y="298" width="110" height="7" rx="3.5" fill="#24354d"/><rect x="865" y="298" width="76" height="7" rx="3.5" fill="#60a5fa"/>
<!-- mini tech chips -->
<rect x="777" y="317" width="54" height="16" rx="8" fill="#101f35" stroke="#29415e"/><text x="804" y="329" fill="#93c5fd" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">PYTHON</text>
<rect x="840" y="317" width="54" height="16" rx="8" fill="#101f35" stroke="#29415e"/><text x="867" y="329" fill="#93c5fd" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">FASTAPI</text>
<rect x="903" y="317" width="54" height="16" rx="8" fill="#101f35" stroke="#29415e"/><text x="930" y="329" fill="#93c5fd" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">GITHUB</text>
</g>

<!-- assembly arrow -->
<g font-family="Arial,sans-serif" text-anchor="middle"><text x="917" y="382" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="2">05 · PROFILE ASSEMBLED</text><text x="917" y="404" fill="#64748b" font-size="11">Identity + skills + code + activity</text></g>

<!-- animated scan -->
<rect x="745" y="168" width="345" height="176" rx="22" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="168;168;168" dur="2.5s"/></rect>

<rect x="40" y="360" width="645" height="54" rx="16" fill="#0b1220" stroke="#24354d"/>
<circle cx="66" cy="387" r="5" fill="#22d3ee"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="84" y="383" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12" font-weight="700">ASSEMBLY STATUS</text>
<text x="84" y="401" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Collecting signals → structuring the profile → presenting the finished identity</text>
<text x="1160" y="470" fill="#475569" font-family="Arial,sans-serif" font-size="10" text-anchor="end" letter-spacing="2">BUILD · LEARN · DEPLOY · IMPROVE</text>
</svg>