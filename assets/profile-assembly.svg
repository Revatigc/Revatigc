<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Revati G Chavadal — profile assembly</title>
<desc id="desc">A clean animated developer profile assembly showing identity, skills, GitHub, activity, and the final profile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080b16"/>
    <stop offset="0.55" stop-color="#10182a"/>
    <stop offset="1" stop-color="#080b16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/>
    <stop offset="0.5" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#172033"/>
    <stop offset="1" stop-color="#0d1424"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".045"/>
  </pattern>
</defs>

<rect width="1200" height="460" rx="28" fill="url(#bg)"/>
<rect width="1200" height="460" rx="28" fill="url(#grid)"/>
<ellipse cx="600" cy="420" rx="430" ry="45" fill="#60a5fa" opacity=".08" filter="url(#glow)"/>

<!-- Header -->
<text x="70" y="72" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">PROFILE ASSEMBLY</text>
<text x="70" y="101" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14" letter-spacing="1.5">BUILDING A DEVELOPER PROFILE FROM SIGNALS</text>
<rect x="70" y="124" width="1060" height="1" fill="#334155"/>

<!-- Progress line -->
<line x1="135" y1="214" x2="1065" y2="214" stroke="#334155" stroke-width="4"/>
<line x1="135" y1="214" x2="1065" y2="214" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="930" stroke-dashoffset="930">
  <animate attributeName="stroke-dashoffset" values="930;0;0;930" keyTimes="0;.72;.9;1" dur="10s" repeatCount="indefinite"/>
</line>

<!-- Nodes -->
<g fill="#0b1220" stroke="#475569" stroke-width="2">
  <circle cx="135" cy="214" r="12"/><circle cx="368" cy="214" r="12"/><circle cx="600" cy="214" r="12"/><circle cx="832" cy="214" r="12"/><circle cx="1065" cy="214" r="12"/>
</g>
<g fill="url(#accent)" filter="url(#glow)">
  <circle cx="135" cy="214" r="5"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="368" cy="214" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="214" r="5"><animate attributeName="opacity" values=".25;.25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="832" cy="214" r="5"><animate attributeName="opacity" values=".25;.25;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="1065" cy="214" r="5"><animate attributeName="opacity" values=".25;.25;.25;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Cards -->
<g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
  <g>
    <rect x="55" y="148" width="160" height="132" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="135" y="177" fill="#67e8f9" font-size="11" letter-spacing="2">01</text>
    <text x="135" y="211" fill="#f8fafc" font-size="17" font-weight="700">IDENTITY</text>
    <text x="135" y="237" fill="#94a3b8" font-size="12">Revati G Chavadal</text>
    <text x="135" y="257" fill="#64748b" font-size="11">AI / ML · Backend</text>
  </g>
  <g>
    <rect x="288" y="148" width="160" height="132" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="368" y="177" fill="#67e8f9" font-size="11" letter-spacing="2">02</text>
    <text x="368" y="211" fill="#f8fafc" font-size="17" font-weight="700">SKILLS</text>
    <text x="368" y="237" fill="#94a3b8" font-size="12">Python · FastAPI</text>
    <text x="368" y="257" fill="#64748b" font-size="11">Data · Cloud · APIs</text>
  </g>
  <g>
    <rect x="520" y="148" width="160" height="132" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="600" y="177" fill="#67e8f9" font-size="11" letter-spacing="2">03</text>
    <text x="600" y="211" fill="#f8fafc" font-size="17" font-weight="700">GITHUB</text>
    <text x="600" y="237" fill="#94a3b8" font-size="12">Projects · Code</text>
    <text x="600" y="257" fill="#64748b" font-size="11">Repos · Contributions</text>
  </g>
  <g>
    <rect x="752" y="148" width="160" height="132" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="832" y="177" fill="#67e8f9" font-size="11" letter-spacing="2">04</text>
    <text x="832" y="211" fill="#f8fafc" font-size="17" font-weight="700">ACTIVITY</text>
    <text x="832" y="237" fill="#94a3b8" font-size="12">Consistency · Growth</text>
    <text x="832" y="257" fill="#64748b" font-size="11">Learning · Shipping</text>
  </g>
  <g>
    <rect x="985" y="148" width="160" height="132" rx="18" fill="url(#card)" stroke="url(#accent)" stroke-width="2"/>
    <text x="1065" y="177" fill="#67e8f9" font-size="11" letter-spacing="2">05</text>
    <text x="1065" y="211" fill="#f8fafc" font-size="17" font-weight="700">ASSEMBLED</text>
    <text x="1065" y="237" fill="#94a3b8" font-size="12">Profile ready</text>
    <text x="1065" y="257" fill="#64748b" font-size="11">Build · Learn · Deploy</text>
  </g>
</g>

<!-- Active scan -->
<rect x="78" y="145" width="154" height="138" rx="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.16;.21;1" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="311" y="145" width="154" height="138" rx="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.16;.22;.34;1" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="543" y="145" width="154" height="138" rx="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.34;.37;.39;.52;1" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="775" y="145" width="154" height="138" rx="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.52;.55;.58;.6;.72;1" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="1008" y="145" width="154" height="138" rx="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="0;0;0;0;0;1;1" keyTimes="0;.7;.72;.75;.78;.8;.94" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- Footer status -->
<g font-family="Arial,sans-serif">
  <rect x="70" y="330" width="1060" height="62" rx="16" fill="#0b1220" stroke="#263247"/>
  <circle cx="96" cy="361" r="6" fill="#22d3ee">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="115" y="357" fill="#e2e8f0" font-size="13" font-weight="700">SYSTEM STATUS</text>
  <text x="115" y="377" fill="#64748b" font-size="11">Collecting profile signals and assembling a clear developer identity</text>
  <text x="1100" y="368" fill="#67e8f9" font-size="12" text-anchor="end" letter-spacing="1.5">PROFILE READY</text>
</g>

<!-- Bottom label -->
<text x="600" y="425" fill="#64748b" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" letter-spacing="3">IDENTITY · SKILLS · CODE · ACTIVITY · ASSEMBLY</text>
</svg>